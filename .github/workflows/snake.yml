name: Generar animación snake

on:
  schedule:
    - cron: "17 */6 * * *" # cuatro veces al día; el minuto no redondo reduce retrasos de GitHub Actions
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: github-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
